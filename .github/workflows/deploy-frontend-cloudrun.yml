name: Deploy Frontend (Next.js 16) to Google Cloud Run

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'public/**'
      - 'Dockerfile'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'next.config.ts'
      - '.github/workflows/deploy-frontend-cloudrun.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  GCP_REGION: us-central1
  ARTIFACT_REGISTRY_REPO: autopulse-repository
  SERVICE_NAME: autopulse-web
  IMAGE_NAME: autopulse-web

jobs:
  verify-and-check:
    name: 🔍 Lint & Build Verification (Next.js 16)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js (22.x)
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Run TypeScript Check / Linter
        run: pnpm tsc --noEmit

  deploy-cloudrun:
    name: 🚀 Build, Push & Deploy Frontend to Cloud Run
    needs: verify-and-check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      # 1. Authenticate with GCP via Workload Identity Federation (WIF) or SA Key
      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_WIF_SA_EMAIL }}
          credentials_json: ${{ secrets.GCP_SA_KEY }}
          create_credentials_file: true

      # 2. Configure Docker authentication against Artifact Registry
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Authenticate Docker to Google Artifact Registry
        run: |-
          gcloud auth configure-docker ${{ env.GCP_REGION }}-docker.pkg.dev --quiet

      # 3. Build & Push Docker image with GHA Layer Cache & Build Args
      - name: Define Image Tags
        id: image-tags
        run: |
          REGISTRY="${{ env.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.ARTIFACT_REGISTRY_REPO }}"
          FULL_IMAGE="${REGISTRY}/${{ env.IMAGE_NAME }}"
          echo "IMAGE_SHA=${FULL_IMAGE}:${{ github.sha }}" >> $GITHUB_OUTPUT
          echo "IMAGE_LATEST=${FULL_IMAGE}:latest" >> $GITHUB_OUTPUT

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_URL }}
          tags: |
            ${{ steps.image-tags.outputs.IMAGE_SHA }}
            ${{ steps.image-tags.outputs.IMAGE_LATEST }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 4. Deploy to Google Cloud Run (1 vCPU, 512MiB, Scale-to-Zero)
      - name: Deploy to Cloud Run
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.SERVICE_NAME }}
          region: ${{ env.GCP_REGION }}
          image: ${{ steps.image-tags.outputs.IMAGE_SHA }}
          flags: >-
            --port=3000
            --min-instances=0
            --max-instances=10
            --cpu=1
            --memory=512Mi
            --allow-unauthenticated

      - name: Display Cloud Run Service URL
        run: |
          echo "✅ Frontend Web App successfully deployed to Cloud Run!"
          echo "🌐 URL: ${{ steps.deploy.outputs.url }}"
